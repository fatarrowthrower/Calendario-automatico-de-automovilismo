name: Actualizar automovilismo

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Actualizar calendarios
        run: python update.py
      - name: Guardar cambios
        run: |
          git config user.name "automovilismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data output
          git diff --cached --quiet || git commit -m "Actualizar calendario"
          git push
