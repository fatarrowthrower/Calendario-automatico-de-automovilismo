name: Actualizar automovilismo

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar motocal
        run: motocal version

      - name: Probar acceso TC2000
        run: |
          python - <<'PY'
          import requests
          from curl_cffi import requests as curl_requests

          url = "https://www.tc2000.com.ar/"

          print("=== REQUESTS NORMAL ===")
          try:
              r = requests.get(
                  url,
                  timeout=30,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  },
              )
              print(f"HTTP: {r.status_code}")
              print(f"URL final: {r.url}")
          except Exception as exc:
              print(f"ERROR: {exc}")

          print()
          print("=== CURL_CFFI / CHROME ===")
          try:
              r = curl_requests.get(
                  url,
                  impersonate="chrome",
                  timeout=30,
              )
              print(f"HTTP: {r.status_code}")
              print(f"URL final: {r.url}")
              print(f"Bytes: {len(r.content)}")
          except Exception as exc:
              print(f"ERROR: {exc}")
          PY

      - name: Actualizar ACTC
        run: python actc.py

      - name: Actualizar IndyCar
        run: python indycar.py

      - name: Actualizar calendarios
        run: python update.py

      - name: Publicar calendario
        run: |
          cp output/automovilismo.ics docs/automovilismo.ics
          cp data/events.csv docs/events.csv
          cp data/events.json docs/events.json

      - name: Guardar cambios
        run: |
          git config user.name "automovilismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data output docs
          git diff --cached --quiet || git commit -m "Actualizar calendario"
          git push
