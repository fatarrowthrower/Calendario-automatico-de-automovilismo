name: Actualizar automovilismo

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar motocal
        run: motocal version

      - name: Actualizar ACTC
        run: python actc.py

      - name: Probar IndyCar
        run: python indycar.py

      - name: Actualizar calendarios
        run: python update.py

      - name: Publicar calendario
        run: |
          cp output/automovilismo.ics docs/automovilismo.ics
          cp data/events.csv docs/events.csv
          cp data/events.json docs/events.json

      - name: Guardar cambios
        run: |
          git config user.name "automovilismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data output docs
          git diff --cached --quiet || git commit -m "Actualizar calendario"
          git push
